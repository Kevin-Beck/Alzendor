[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# The slow tests (the tuning bot) only run when asked: pytest -m slow, or
# pytest -m "slow or not slow" for everything (CI does).
addopts = -m "not slow"
markers =
    slow: takes a while (tests/test_tuning.py); deselected unless asked for with -m
