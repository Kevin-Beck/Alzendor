# Local setup: Redis plus two game servers, to show that players on different
# servers share one world. Open http://localhost:8001 and http://localhost:8002.
# Production is deploy/iterbotgames. Redis isn't published on the host: a
# checkout's `python -m alzendor` or tests can't reach the game's rules.
# To look inside: docker compose exec redis redis-cli
name: alzendor

x-server-env: &server-env
  ALZ_REDIS_URL: redis://redis:6379/0

x-server: &server
  build: .
  image: alzendor:latest
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  depends_on:
    redis:
      condition: service_healthy

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  server1:
    <<: *server
    environment:
      <<: *server-env
      ALZ_SERVER_ID: server1
    ports:
      - "8001:8000"

  server2:
    <<: *server
    environment:
      <<: *server-env
      ALZ_SERVER_ID: server2
    ports:
      - "8002:8000"

  # `docker compose --profile test run --rm test` runs the tests against a Redis
  # of their own: never the game's, since Redis functions are server-wide and the
  # tests load this checkout's rules.
  test-redis:
    image: redis:7.4-alpine
    profiles: [test]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  test:
    build:
      context: .
      target: test
    profiles: [test]
    environment:
      ALZ_TEST_REDIS_URL: redis://test-redis:6379/15
      ALZ_REQUIRE_NODE: "1"
    depends_on:
      test-redis:
        condition: service_healthy

volumes:
  redis-data:
